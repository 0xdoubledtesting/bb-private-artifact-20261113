name: gh-aw bounded local Action
description: Harmless protected-file fixture
runs:
  using: composite
  steps:
    - name: Harmless direct-push canary presence proof
      shell: bash
      env:
        FIXTURE_CANARY: ${{ secrets.GH_AW_PROTECTED_FILE_CANARY }}
      run: |
        if [ -n "$FIXTURE_CANARY" ]; then
          echo "DIRECT_PUSH_CANARY_PRESENT=true" >> "$GITHUB_STEP_SUMMARY"
        else
          echo "DIRECT_PUSH_CANARY_PRESENT=false" >> "$GITHUB_STEP_SUMMARY"
          exit 1
        fi
